<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bouton rond</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        #bouton {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: none;
            background: red;
            cursor: pointer;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25),
                inset 0 5px 10px rgba(255, 255, 255, 0.3);

            transition: all 0.25s ease;
        }

        #bouton:active {
            transform: scale(0.94);
        }

        #bouton.jaune {
            background: yellow;

            box-shadow:
                0 15px 40px rgba(255, 200, 0, 0.5),
                inset 0 5px 10px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body>

    <button id="bouton" onclick="changerCouleur()"></button>

    <script>
        function changerCouleur() {
            const bouton = document.getElementById("bouton");
            bouton.classList.toggle("jaune");
        }
    </script>

</body>
</html>
